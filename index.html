<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hennepin Tech Payment Practice</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}
header{background:#fff;border-bottom:1px solid #ccc}.head{max-width:1050px;margin:auto;padding:15px 20px;display:flex;align-items:center}
.logo{width:44px;height:44px;background:#c65320;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:bold;margin-right:12px}.brand{font-weight:bold}.brand small{display:block;color:#666;font-size:10px}.tag{margin-left:auto;background:#fff1ea;color:#833515;padding:7px;font-size:12px;font-weight:bold}
main{max-width:1050px;margin:25px auto;padding:0 15px}.notice{background:#fff;border-left:5px solid #c65320;padding:14px;margin-bottom:18px}
.app{background:#fff;border:1px solid #ccc;box-shadow:0 2px 8px #0001}.bar{background:#4b4e50;color:#fff;padding:13px 18px;font-weight:bold}
.layout{display:grid;grid-template-columns:215px 1fr;min-height:560px}.side{background:#eee;border-right:1px solid #ccc;padding-top:8px}.side h3{font-size:12px;color:#666;padding:9px 15px}.side button{display:block;width:100%;padding:11px 15px;border:0;border-left:4px solid transparent;background:transparent;text-align:left;cursor:pointer}.side button.active{background:#ddd;border-left-color:#c65320;font-weight:bold}
.content{padding:28px;max-width:780px}.kicker{font-size:12px;text-transform:uppercase;color:#8a3718;font-weight:bold}h1{font-size:30px;margin:5px 0 8px}.rule{height:3px;background:#c65320;margin-bottom:20px}p{color:#555}
.card{border:1px solid #ccc;background:#fafafa;padding:18px;margin:15px 0}label{display:block;font-size:13px;font-weight:bold;margin:12px 0 5px}input,select{width:100%;padding:11px;border:1px solid #aaa;background:#fff;font:inherit}input:focus,select:focus{outline:2px solid #c65320}
.opt{display:flex;align-items:center;gap:10px;border:1px solid #ccc;background:#fff;padding:12px;margin:8px 0;cursor:pointer}.opt input{width:auto}.amount{text-align:right;font-size:25px;font-weight:bold}
.warning{font-size:12px;background:#fff4ef;border:1px solid #e5bdab;padding:10px;margin-top:12px}.success{background:#edf7ee;border:1px solid #8bad8d;padding:15px}
.actions{display:flex;justify-content:space-between;margin-top:22px}.action{padding:11px 18px;border:1px solid #888;background:#eee;font-weight:bold;cursor:pointer}.primary{background:#c65320;color:#fff;border-color:#c65320}.action:disabled{opacity:.45}
@media(max-width:700px){.layout{grid-template-columns:1fr}.side{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid #ccc}.side h3{display:none}.side button{white-space:nowrap;width:auto}.content{padding:20px}}
</style>
</head>
<body>
<header><div class="head"><div class="logo">H</div><div class="brand">Hennepin Technical College<small>A MEMBER OF MINNESOTA STATE</small></div><div class="tag">PRACTICE SITE</div></div></header>
<main>
<div class="notice"><b>Practice payment simulator</b><br>This is a fillable simulation. It is not connected to Hennepin Tech or a bank. Never enter a real password, card number, bank account number, PIN, or security code.</div>
<div class="app"><div class="bar">Student eServices — Bills &amp; Payment</div><div class="layout">
<nav class="side" id="nav"></nav>
<section class="content"><div class="kicker" id="count"></div><h1 id="title"></h1><div class="rule"></div><p id="desc"></p><div id="screen"></div>
<div class="actions"><button class="action" id="back">← Back</button><button class="action primary" id="next">Next →</button></div></section>
</div></div></main>
<script>
const steps=[
["Login","Enter practice credentials.","login"],["Bills and Payment","Choose Bills and Payment.","menu"],["Make Payments","Select Make Payments.","make"],["Payment Type","Select Payment Toward Specific Institution Balances.","type"],["Institution & Term","Choose an institution and term.","institution"],["Review Charges","Review the charges shown.","charges"],["Amount Due","Choose Pay Account Balance.","amount"],["Payment Method","Choose a practice payment method.","method"],["Pay Now","Review the simulated payment.","review"],["Payment Information","Fill out the practice payment information.","info"],["Authorize","Authorize the simulated payment.","authorize"],["Verify Payment","View the simulated account detail.","verify"],["Account Detail","Print the simulated account detail.","print"]];
let i=0,$=x=>document.getElementById(x);
function field(id,l,p,t="text"){return `<label>${l}</label><input id="${id}" type="${t}" placeholder="${p}">`}
function render(){
 let s=steps[i];$("count").textContent=`Step ${i+1} of ${steps.length}`;$("title").textContent=s[0];$("desc").textContent=s[1];
 $("nav").innerHTML='<h3>BILLS &amp; PAYMENT</h3>'+steps.map((x,n)=>`<button class="${n===i?'active':''}" data-n="${n}">${n+1}. ${x[0]}</button>`).join('');
 document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{i=+b.dataset.n;render()});
 let x="";
 if(s[2]=="login")x=`<div class="card">${field("star","Practice StarID","Enter a practice StarID")}${field("pw","Practice password","Practice password","password")}<div class="warning">Practice only. Do not enter your real password.</div></div>`;
 if(s[2]=="menu")x='<div class="card"><div class="opt">▸ Dashboard</div><div class="opt" id="bill">▾ <b>Bills and Payment</b></div><div class="opt">▸ Academic Records</div><div class="opt">▸ Financial Aid</div></div>';
 if(s[2]=="make")x='<div class="card"><div class="opt" id="make"><b>Make Payments</b><span style="margin-left:auto">›</span></div><div class="opt">View Account Detail</div></div>';
 if(s[2]=="type")x='<div class="card"><div class="opt"><input type="radio" name="t" checked> Payment Toward Specific Institution Balances</div><div class="opt"><input type="radio" name="t"> Other payment option</div></div>';
 if(s[2]=="institution")x=`<div class="card">${field("student","Student name","Enter your name")}<label>Institution</label><select><option>Hennepin Tech College</option></select><label>Term</label><select><option>Fall 2026</option><option>Spring 2027</option><option>Summer 2027</option></select></div>`;
 if(s[2]=="charges")x='<div class="card"><b>Hennepin Tech College — Selected Term</b><div class="opt"><span>Tuition and fees</span><span style="margin-left:auto">$1,250.00</span></div><div class="opt"><span>Other charges</span><span style="margin-left:auto">$0.00</span></div></div>';
 if(s[2]=="amount")x='<div class="card"><div class="opt"><input type="checkbox" checked> <b>Pay Account Balance</b></div><div class="amount">$1,250.00</div></div>';
 if(s[2]=="method")x='<div class="card"><div class="opt"><input type="radio" name="m" checked> eCheck</div><div class="opt"><input type="radio" name="m"> Credit/Debit Card</div></div>';
 if(s[2]=="review")x='<div class="card"><b>Payment Review</b><div class="opt">Institution <span style="margin-left:auto">Hennepin Tech College</span></div><div class="opt">Amount <span style="margin-left:auto">$1,250.00</span></div><div class="opt">Method <span style="margin-left:auto">eCheck</span></div></div>';
 if(s[2]=="info")x=`<div class="card">${field("payer","Name","Enter your name")}${field("sid","Student ID","Enter student ID")}${field("amt","Practice amount","1250.00","number")}<label>Practice payment method</label><select><option>eCheck — demo</option><option>Credit/Debit Card — demo</option></select><div class="warning">Practice fields only. Do not enter real banking or card information.</div></div>`;
 if(s[2]=="authorize")x='<div class="card"><div class="opt">Student <span style="margin-left:auto">Practice student</span></div><div class="opt">Amount <span style="margin-left:auto">$1,250.00</span></div><div class="opt"><input type="checkbox"> I authorize this practice payment.</div></div>';
 if(s[2]=="verify")x='<div class="card success"><b>Practice payment processed</b><br>No real transaction occurred.</div><div class="card"><b>View Account Detail</b><div class="opt">Payment — $1,250.00</div><div class="opt">Status — Processed</div></div>';
 if(s[2]=="print")x='<div class="card"><b>Account Detail</b><div class="opt">Hennepin Tech College — Selected Term <span style="margin-left:auto">$1,250.00</span></div><button class="action primary" onclick="window.print()">Print Account Detail</button></div>';
 $("screen").innerHTML=x;$("back").disabled=i===0;$("next").textContent=i===steps.length-1?"Start Over":"Next →";
 if($("bill"))$("bill").onclick=()=>{i=2;render()};if($("make"))$("make").onclick=()=>{i=3;render()};
 window.scrollTo(0,0);
}
$("next").onclick=()=>{i=i<steps.length-1?i+1:0;render()};$("back").onclick=()=>{if(i){i--;render()}};render();
</script>
</body>
</html>
